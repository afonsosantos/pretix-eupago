[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pretix-eupago"
version = "1.1.0"
description = "Accept Multibanco and MB WAY payments via euPago in pretix"
readme = "README.rst"
requires-python = ">=3.11"
license = { text = "Apache Software License" }
authors = [
    { name = "Afonso Santos" },
]
dependencies = [
    "requests>=2.31",
    "cryptography>=42",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
test = [
    "pretix",
    "pytest",
    "pytest-django",
    "responses",
    "django-scopes",
]

[project.urls]
Homepage = "https://github.com/afonsosantos/pretix-eupago"
Issues = "https://github.com/afonsosantos/pretix-eupago/issues"

[project.entry-points."pretix.plugin"]
pretix_eupago = "pretix_eupago:PluginApp"

[dependency-groups]
dev = [
    "ruff",
]

[tool.setuptools.packages.find]
include = ["pretix_eupago*"]

[tool.setuptools.package-data]
pretix_eupago = ["templates/**/*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = "test_*.py"
pythonpath = ["."]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I"]
