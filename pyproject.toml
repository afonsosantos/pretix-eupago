[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pretix-eupago"
version = "1.0.0"
description = "Accept Multibanco and MB WAY payments via euPago in pretix"
readme = "README.rst"
requires-python = ">=3.9"
license = { text = "Apache Software License" }
authors = [
    { name = "Afonso Santos" },
]
dependencies = [
    "requests",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
test = [
    "pretix",
    "pytest",
    "pytest-django",
    "responses",
    "django-scopes",
]

[project.urls]
Homepage = "https://github.com/afonsosantos/pretix-eupago"

[project.entry-points."pretix.plugin"]
pretix_eupago = "pretix_eupago:PluginApp"

[tool.setuptools.packages.find]
include = ["pretix_eupago*"]

[tool.setuptools.package-data]
pretix_eupago = ["templates/**/*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = "test_*.py"
pythonpath = ["."]
